services:
  - type: web
    name: slayer-picks
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm run build:deploy
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
